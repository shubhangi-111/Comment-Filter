<!DOCTYPE html>
<html>
<head>
    <title>Comment Filter</title>
</head>
<body>
    <h2>AI Comment Filter</h2>

    <form method="POST">
        <textarea name="comment" rows="5" cols="50" placeholder="Enter comment"></textarea><br><br>
        <button type="submit">Analyze</button>
    </form>

    {% if result %}
        <h3>Result: {{ result }}</h3>
    {% endif %}
</body>
</html>
