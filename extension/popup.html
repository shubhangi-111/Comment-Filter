<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>Creator Safety Shield</title>
    <style>
        body {
            width: 280px;
            background: #0f172a;
            color: #f8fafc;
            font-family: system-ui, -apple-system, sans-serif;
            padding: 1rem;
            margin: 0;
        }

        .header {
            display: flex;
            align-items: center;
            gap: 0.5rem;
            margin-bottom: 0.75rem;
        }

        h2 {
            font-size: 1rem;
            font-weight: 700;
            margin: 0;
        }

        .status-badge {
            background: rgba(16, 185, 129, 0.2);
            color: #10b981;
            border: 1px solid #10b981;
            padding: 0.25rem 0.5rem;
            border-radius: 4px;
            font-size: 0.75rem;
            font-weight: 600;
            display: inline-block;
            margin-bottom: 0.75rem;
        }

        .info-card {
            background: #1e293b;
            border: 1px solid #334155;
            padding: 0.75rem;
            border-radius: 8px;
            font-size: 0.8rem;
            color: #94a3b8;
            margin-bottom: 1rem;
        }

        .btn {
            display: block;
            width: 100%;
            background: #6366f1;
            color: white;
            text-align: center;
            padding: 0.6rem;
            border-radius: 6px;
            text-decoration: none;
            font-weight: 600;
            font-size: 0.85rem;
        }
    </style>
</head>
<body>
    <div class="header">
        <span>🛡️</span>
        <h2>Creator Safety Shield</h2>
    </div>
    <span class="status-badge">● Active Protection</span>
    <div class="info-card">
        <div><strong>Plan:</strong> ₹99/mo Single Plan</div>
        <div style="margin-top: 4px;"><strong>Target Platforms:</strong> YouTube & Instagram</div>
    </div>
    <div class="info-card" style="margin-bottom: 1rem;">
        <label for="userIdInput" style="display:block; margin-bottom: 4px; font-weight: 600;">Your User ID</label>
        <input type="text" id="userIdInput" placeholder="Enter User ID" style="width: 100%; box-sizing: border-box; padding: 6px; border-radius: 4px; border: 1px solid #334155; background: #0f172a; color: #f8fafc; margin-bottom: 8px;">
        <button id="saveBtn" class="btn" style="background: #10b981; padding: 0.4rem;">Save ID</button>
        <div id="saveStatus" style="font-size: 0.75rem; color: #10b981; margin-top: 4px; display: none;">Saved!</div>
    </div>
    
    <a href="http://localhost:5000" target="_blank" class="btn">Open Evidence Vault Dashboard</a>

    <script src="popup.js"></script>
</body>
</html>
